events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 80;
        access_log off;
        location / {
            set $backend http://app:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
