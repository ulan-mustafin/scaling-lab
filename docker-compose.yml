name: scaling-lab

services:
  app:
    build: ./app
    environment:
      PYTHONUNBUFFERED: "1"
    cpus: ${APP_CPUS:-1.0}
    mem_limit: ${APP_MEMORY:-512m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [experiment]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-18080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [experiment]

networks:
  experiment:
    name: scaling-lab-network
